[workspace]
resolver = "3"
# Crates are added here as the milestones land — see CONTRIBUTING.md.
members = ["crates/core", "crates/store", "crates/api", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/fibenacci/hydrant"
authors = ["Benjamin Letzel <benjamin.letzel@protonmail.com>"]
# Minimum supported Rust version. Edition 2024 needs 1.85, but the fix for
# RUSTSEC-2026-0009 (stack exhaustion in `time`'s RFC 2822 parser) ships only in
# time >= 0.3.47, which requires 1.88 - and cargo's MSRV-aware resolver silently
# holds the vulnerable 0.3.45 as long as this says 1.85. A version promise that
# forces a known-vulnerable dependency is the wrong trade for a public service.
#
# The CI "MSRV" job type-checks against exactly this version, so raising it stays
# a deliberate, documented change rather than a side effect of a dependency bump.
rust-version = "1.88"

[workspace.lints.rust]
# There is no FFI and no performance argument for it in a JSON projection engine.
unsafe_code = "forbid"
# CI treats warnings as errors, so this makes an undocumented public item a build
# failure. That is the intent: the invariants live in the doc comments.
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A panic in the projection path is a dropped record, not a crash report. Tests may
# still unwrap - see clippy.toml.
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# No `arbitrary_precision`: RFC 8785 defines number serialisation in terms of
# ECMAScript doubles, and an arbitrary-precision number would not round-trip
# through the canonical form. Numeric fidelity beyond f64 is not ours to keep.
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.11"
thiserror = "2"
hex = "0.4"
hmac = "0.13"
getrandom = "0.4"
# sqlx 0.9 exists but requires Rust 1.94, well beyond the 1.88 MSRV. Unlike the
# `time` bump above there is no security reason to follow it, so it waits.
sqlx = { version = "0.8.6", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "json",
    "time",
    "macros",
    "migrate",
] }
time = { version = "0.3", features = ["formatting"] }
tokio = "1"
axum = "0.8"
tracing = "0.1"
tower = "0.5"
http-body-util = "0.1"
form_urlencoded = "1"
# serde_yaml is archived and serde_yml unmaintained; serde_yaml_ng is the fork that
# is still getting releases.
serde_yaml_ng = "0.10"
clap = { version = "4", features = ["derive"] }
tower-http = "0.7"
figment = { version = "0.10", features = ["env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# internal
hydrant-core = { path = "crates/core" }
hydrant-store = { path = "crates/store" }
hydrant-api = { path = "crates/api" }

# dev
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1

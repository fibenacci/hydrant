# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# Run locally with: make deny

[advisories]
version = 2
# Vulnerabilities fail the build (default). A yanked crate only warns, so a
# transient yank upstream does not block CI.
yanked = "warn"
ignore = []

[licenses]
version = 2
# Permissive and weak-copyleft licenses accepted for dependencies. hydrant itself
# is Apache-2.0; anything stricter than MPL-2.0 in the tree needs a decision, not
# an entry added in passing.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    # The Mozilla CA root store shipped by webpki-roots. A data licence for the certificate
    # bundle, not a code licence - permissive, with no source or notice obligation.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are normal in a healthy tree; warn rather than fail.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

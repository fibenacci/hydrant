name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

# Supersede in-flight PR runs; never cancel a push to main, because the
# release-plz job at the end must always run to completion.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. The two jobs that need more declare it themselves.
permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: '1'
    # A stale Cargo.lock fails CI instead of being silently updated.
    CARGO_LOCKED: '--locked'
    # Minimum supported Rust version, kept in sync with rust-version in Cargo.toml.
    MSRV: '1.88.0'
    # sqlx verifies its queries at compile time against the committed .sqlx metadata, so every job
    # but the test job builds without a database. The test job checks that metadata is current.
    SQLX_OFFLINE: 'true'

# Third-party actions are pinned to a commit SHA, with the human-readable version
# in a trailing comment: a mutable tag is a supply-chain hole in a workflow that
# can see repository secrets. Dependabot keeps both in sync (.github/dependabot.yml).
jobs:
    format:
        name: Format
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
            -   run: make fmt-check

    lint:
        name: Clippy
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
            -   uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
            -   run: make clippy

    docs:
        name: Rustdoc
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
            -   uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
            -   run: make doc

    msrv:
        name: MSRV (${{ env.MSRV }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # rust-toolchain.toml pins stable for everyone else; this overrides it so the
        # MSRV claim is actually tested instead of silently checked on stable.
        env:
            RUSTUP_TOOLCHAIN: ${{ env.MSRV }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
                with:
                    toolchain: ${{ env.MSRV }}
            -   uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
            -   run: make check

    typos:
        name: Typos
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

    # cargo-deny covers advisories, licenses, bans and sources in one pass, against
    # the real build graph — so a crate that is never compiled is not flagged, and a
    # dependency licence outside deny.toml fails the build.
    deny:
        name: Cargo Deny
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
                with:
                    tool: cargo-deny
            -   run: make deny

    codeql:
        name: CodeQL
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            security-events: write
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
                with:
                    languages: rust
                    build-mode: none
            -   uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

    test:
        name: Tests
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # The store is tested against PostgreSQL, not against a mock: idempotency lives in an
        # ON CONFLICT clause and tombstones in check constraints, and neither can be verified
        # anywhere else. Same image digest as compose.yaml.
        services:
            postgres:
                image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
                env:
                    POSTGRES_DB: hydrant
                    POSTGRES_USER: hydrant
                    POSTGRES_PASSWORD: hydrant
                    POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
                ports:
                    -   5432:5432
                options: >-
                    --health-cmd "pg_isready -U hydrant -d hydrant"
                    --health-interval 2s
                    --health-timeout 3s
                    --health-retries 15
        env:
            DATABASE_URL: postgres://hydrant:hydrant@localhost:5432/hydrant
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
            -   uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
            -   uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
                with:
                    # sqlx-cli is pinned to the sqlx version in Cargo.toml: a newer CLI writes
                    # metadata the library cannot read.
                    tool: cargo-nextest,sqlx-cli@0.8.6
            -   name: Apply migrations
                run: make migrate
            -   name: Committed query metadata is current
                env:
                    SQLX_OFFLINE: 'false'
                run: make sqlx-check
            -   id: nextest
                run: make test-junit
            -   id: doctests
                if: always()
                run: make doctest
            -   name: Upload JUnit report
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: junit-report
                    path: target/nextest/ci/junit.xml
                    if-no-files-found: ignore
            # `if: always()` above means a failing nextest step would otherwise be
            # masked by a passing upload; aggregate both outcomes explicitly.
            -   name: Aggregate test outcomes
                if: always()
                run: |
                    .github/scripts/gate.sh "A test suite failed - see the steps above." \
                        "nextest=${{ steps.nextest.outcome }}" \
                        "doctests=${{ steps.doctests.outcome }}"

    # The single required status check for branch protection. GATE_STRICT also fails
    # on cancelled or skipped jobs, so a green tick can never mean "did not run".
    ci:
        name: CI
        needs: [format, lint, docs, msrv, typos, deny, codeql, test]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   name: Require every job to have succeeded
                run: |
                    GATE_STRICT=1 .github/scripts/gate.sh \
                        "One or more required jobs failed, were cancelled, or were skipped." \
                        "format=${{ needs.format.result }}" \
                        "clippy=${{ needs.lint.result }}" \
                        "rustdoc=${{ needs.docs.result }}" \
                        "msrv=${{ needs.msrv.result }}" \
                        "typos=${{ needs.typos.result }}" \
                        "cargo-deny=${{ needs.deny.result }}" \
                        "codeql=${{ needs.codeql.result }}" \
                        "tests=${{ needs.test.result }}"

    # Opens or updates the release PR (version bump + CHANGELOG.md). Merging it
    # pushes the v<version> tag and creates the GitHub release. Nothing goes to
    # crates.io - see release-plz.toml.
    release-plz:
        name: Release PR
        needs: [ci]
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            pull-requests: write
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
            -   uses: release-plz/action@18641b6c63063cc5ff8786ebf69cd57e8541bae1 # v0.5.140
                with:
                    command: release-plz
                env:
                    # A PAT or GitHub App token lets the release PR trigger CI; with the
                    # default token GitHub's recursion guard keeps the PR unchecked.
                    GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
